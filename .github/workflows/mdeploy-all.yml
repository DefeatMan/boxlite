# One dispatch: have the artifacts this ref needs, then deploy it.
#
# The only way a stage is rolled out. `mdeploy.yml` and `mrunner.yml` used to be
# dispatchable beside this and are gone: their work is the `deploy` and
# `build-runner` jobs below, in the job that decides, because a second job on
# one Environment is a second wait on its reviewers. `mbuild.yml` survives as a
# callee only — nobody dispatches a commit publish by hand any more.
#
# What the ref is decides almost everything else:
#
#   a commit SHA      the development path. Images are built for this stage
#                     under `<sha>`, the runner binary is compiled and staged in
#                     this stage's artifacts bucket. dev only.
#
#   a release tag     the release path. Images are the `v<X.Y.Z>-<sha>` bytes
#                     mbuild-release publishes into dev and promotes to prod;
#                     the runner is the tarball already attached to the GitHub
#                     Release, not a rebuild of it. prod takes nothing else.
#
# prod is promote-only on purpose. Promotion moves the bytes dev already scanned
# and served, and a rebuild of one commit is not byte-identical — gzip alone
# stamps an mtime into the runner tarball, and everything downstream treats
# version+commit as an identity and never looks inside. Two stages that built
# one commit hold two sets of bytes under one name.
#
# Nothing here names a cloud, a registry or a bucket: every job asks the stage's
# own declaration, exactly as the tools it calls do.
name: mdeploy-all

# What this run does, to what, at which ref — an Actions list of bare
# `mdeploy-all` rows says nothing about which one touched prod.
run-name: >-
  ${{ inputs.apply && 'deploy' || 'preview' }} ${{ inputs.stage }} at ${{ inputs.ref || github.sha }}

on:
  workflow_dispatch:
    inputs:
      # A choice rather than free text: this value selects the deployment
      # Environment of every job below, and an Environment carries the secrets
      # and the reviewers of the stage it names. Enforced across every workflow
      # by apps/infra/deployment/release-safety.test.ts.
      stage:
        description: Stage to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      components:
        description: Which artifacts this ref needs before it is deployed
        required: true
        default: api+runner
        type: choice
        options:
          - api+runner
          - api
          - runner
      ref:
        description: >-
          A release tag (v<X.Y.Z>), or a commit SHA for a dev rollout. Empty
          uses this dispatch's own commit, which is a dev rollout.
        required: false
      apply:
        description: Apply the change. Off previews it and stops.
        required: true
        type: boolean
        default: false
      confirm:
        description: Required for a stage whose declaration marks it protected
        required: true
        type: boolean
        default: false

concurrency:
  # One of these per stage. The image workflows it calls hold their own groups —
  # a publish per stage — and the apply is this workflow's own job, so without a
  # group here two dispatches would interleave their halves rather than queue,
  # and two applies against one stage would read and write the same checkpoint.
  group: mdeploy-all-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # gh ships on a runner and is never signed in, and the stage declaration names
  # github a required provider — so every step that reaches mstage fails on the
  # session before it fails on anything worth reading. `resolve` needs it for a
  # second reason: it asks the Releases API whether a version was ever cut.
  GH_TOKEN: ${{ github.token }}

jobs:
  # What this run is about, resolved once and refused early.
  #
  # No Environment. Every refusal here is about this repository's own refs and
  # releases, so none of it needs a stage's secrets — and a job that bound one
  # would cost an approval before the run could tell the operator their ref was
  # a typo.
  resolve:
    name: resolve ${{ inputs.ref || github.sha }}
    # dev is shaken out from the branch that is changing it; every other stage
    # reaches a protected Environment and the cloud role behind it, and runs
    # from main. An allow-list naming dev, so a stage added to the choice list
    # later is main-only until an edit says otherwise.
    if: ${{ github.ref == 'refs/heads/main' || inputs.stage == 'dev' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      version: ${{ steps.classify.outputs.version }}
      image_tag: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Tags, the commits they name, and the branch the containment check
          # below compares against. A shallow checkout carries none of them.
          fetch-depth: 0

      # Which of the two paths this run is on, and whether this stage allows it.
      - name: Classify the ref
        id: classify
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          FALLBACK: ${{ github.sha }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -Eeuo pipefail
          candidate="${REF:-$FALLBACK}"
          version=''
          # `v` and a stable X.Y.Z, which is how this repository spells a release
          # tag, and the same shape mbuild's RELEASE_VERSION accepts.
          if [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            version="$candidate"
          elif [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=ref::'$candidate' is neither a release tag (v<X.Y.Z>) nor a full lowercase commit SHA"
            exit 1
          fi
          # prod takes released bytes and nothing else. Written as a refusal on
          # the absence of a version rather than as a test on the stage list, so
          # a stage added later has to say for itself that a commit may reach it.
          if [ "$STAGE" != 'dev' ] && [ -z "$version" ]; then
            echo "::error title=ref::$STAGE deploys released versions only; give a release tag (v<X.Y.Z>) rather than a commit"
            exit 1
          fi
          # dev may run off the branch changing it, but only on the commit line.
          # `mbuild-release.yml` gates every job on main, so a release rollout
          # dispatched from a branch would skip its publish silently and fail
          # two jobs later at `Verify the images`, naming an address rather than
          # the branch.
          if [ -n "$version" ] && [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "::error title=ref::a release rollout runs from main; $GITHUB_REF can deploy dev from a commit instead"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          echo "${STAGE}: ${candidate}${version:+ (release $version)}"

      # A tag is not a release. The runner binary a release-path deploy installs
      # is an asset on the GitHub Release — `stack/runner-binary.ts:270` composes
      # that URL — so a tag that was pushed but never released, or released
      # before its build finished, resolves to a download that 404s on the host
      # at boot. Both halves are asked here, where the answer costs one API read
      # instead of a rolled-out fleet that cannot start.
      - name: Require the release this tag names
        if: steps.classify.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.classify.outputs.version }}
        run: |
          set -Eeuo pipefail
          if ! release="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>&1)"; then
            echo "::error title=release::$VERSION has no GitHub Release; cut one before deploying it${release:+ ($release)}"
            exit 1
          fi
          if [ "$(printf '%s' "$release" | jq -r '.isDraft')" = 'true' ]; then
            echo "::error title=release::$VERSION is still a draft release; publishing it is what starts its builds"
            exit 1
          fi
          # Asked for every release rollout, not only one whose components name
          # the runner. On this line the version pins the whole stage: the apply
          # exports VERSION, `selectRunnerBinary` prefers it over the workspace
          # version, and the fleet's boot URL becomes this release's tarball
          # whatever `components` said. `components` decides which images are
          # published or promoted; it does not decide which runner a stage runs.
          #
          # The names are `build-runner-binary.yml`'s and `runnerArtifactFor`'s.
          # Asked by name rather than by count, because a release carries the
          # SDK archives too.
          tarball="boxlite-runner-${VERSION}-linux-amd64.tar.gz"
          for asset in "$tarball" "${tarball}.sha256"; do
            held="$(printf '%s' "$release" | jq -r --arg name "$asset" '[.assets[] | select(.name == $name)] | length')"
            if [ "$held" = '0' ]; then
              echo "::error title=release::$VERSION carries no $asset; the runner build for that release has not finished or did not succeed"
              exit 1
            fi
          done
          echo "$VERSION carries $tarball and its checksum"

      # The ref becomes a commit here and nowhere else. Every job below
      # addresses these bytes rather than the name they were given, and a tag
      # that moved between two resolutions would build one commit and deploy
      # another. `branch` refuses a commit the dispatched branch does not
      # contain — existing is not enough, because a commit on a force-pushed
      # branch still resolves and still names bytes.
      - id: ref
        uses: ./.github/actions/resolve-ref
        with:
          ref: ${{ steps.classify.outputs.candidate }}
          branch: ${{ github.ref_name }}

      # The image address's tag, composed once. The release line and the commit
      # line are two addresses on purpose: prod can be narrowed to released
      # bytes only because they are not the same name.
      - name: Address the images
        id: tag
        shell: bash
        env:
          VERSION: ${{ steps.classify.outputs.version }}
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -Eeuo pipefail
          printf 'image=%s\n' "${VERSION:+${VERSION}-}${SHA}" >> "$GITHUB_OUTPUT"

  # What this stage already holds, and therefore what has to happen.
  plan:
    name: plan ${{ inputs.stage }}
    needs: [resolve]
    if: ${{ !cancelled() && !failure() && (github.ref == 'refs/heads/main' || inputs.stage == 'dev') }}
    environment: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.plan.outputs.api }}
      runner: ${{ steps.plan.outputs.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-infra
        with:
          stages: ${{ inputs.stage }}
          stage-config: ${{ vars.BOXLITE_MSTAGE_BOXLITE_APP_CONFIG }}

      - name: Resolve the stage
        id: config
        working-directory: apps/infra
        run: |
          set -Eeuo pipefail
          output="$(npm run --silent mbuild inspect -- --stage "${{ inputs.stage }}")"
          echo "$output" >> "$GITHUB_OUTPUT"

      - name: Federate an AWS identity
        if: steps.config.outputs.kind == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/boxlite-${{ inputs.stage }}-github-deploy
          aws-region: ${{ steps.config.outputs.region }}
          role-session-name: mdeploy-all-plan-${{ github.run_id }}

      - name: Federate a GCP identity
        if: steps.config.outputs.kind == 'artifact-registry'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      - name: Install gcloud
        if: steps.config.outputs.kind == 'artifact-registry'
        uses: google-github-actions/setup-gcloud@v2

      # Two answers, and every input to them is a read. The runner's answer is
      # shorter than it used to be: on the release path there is nothing to
      # decide, because the binary is an asset on the Release and the stack
      # downloads it at boot rather than this run staging it anywhere.
      - name: Decide
        id: plan
        working-directory: apps/infra
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          STAGE: ${{ inputs.stage }}
          COMPONENTS: ${{ inputs.components }}
        run: |
          set -Eeuo pipefail
          api=skip
          runner=skip

          case "$COMPONENTS" in
            *api*)
              if npm run --silent mbuild verify -- --tag "$IMAGE_TAG" --stage "$STAGE"; then
                echo "$STAGE already holds the images for $IMAGE_TAG"
              elif [ -n "$VERSION" ]; then
                # The release line. dev cuts it; every other stage receives the
                # bytes dev already serves.
                api=$([ "$STAGE" = 'dev' ] && echo release-publish || echo release-promote)
              else
                api=build
              fi
              ;;
          esac

          case "$COMPONENTS" in
            *runner*)
              if [ -n "$VERSION" ]; then
                # Nothing to do here. `stack/runner-binary.ts` addresses the
                # GitHub Release asset directly, and `resolve` already proved it
                # is attached.
                echo "$VERSION installs the runner tarball from its GitHub Release"
              else
                # `--check` reads the same answer the build itself would, without
                # the checkout and the compile behind it. `--tag "$SHA"` because
                # this job checks out the branch tip and the deploy installs the
                # commit `resolve` named.
                staged="$(npm run --silent runner:build -- --stage "$STAGE" --check --tag "$SHA" | sed -n 's/^staged=//p')"
                if [ "$staged" = 'complete' ]; then
                  echo "$STAGE already holds a runner binary for $SHA"
                else
                  runner=build
                fi
              fi
              ;;
          esac

          printf 'api=%s\n' "$api" >> "$GITHUB_OUTPUT"
          printf 'runner=%s\n' "$runner" >> "$GITHUB_OUTPUT"
          {
            echo "### plan for \`${IMAGE_TAG}\` on \`$STAGE\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| images | \`$api\` |"
            echo "| runner | \`$runner\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The release line: cut into dev, received by everything else. Both call the
  # workflow that owns the refusals a release needs — a version already in the
  # target registry is an operator mistake, not something to skip over.
  release-publish:
    name: publish images
    needs: [resolve, plan]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.api == 'release-publish' }}
    uses: ./.github/workflows/mbuild-release.yml
    with:
      command: publish
      tag: ${{ needs.resolve.outputs.version }}
      sha: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  release-promote:
    name: promote images
    needs: [resolve, plan]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.api == 'release-promote' }}
    uses: ./.github/workflows/mbuild-release.yml
    with:
      command: promote
      tag: ${{ needs.resolve.outputs.version }}
      sha: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  # The commit line, which only dev reaches. `mbuild.yml` is callee-only for
  # exactly this: it is the development path's publish and nobody's release.
  build-images:
    name: build images
    needs: [resolve, plan]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.api == 'build' }}
    uses: ./.github/workflows/mbuild.yml
    with:
      command: publish
      tag: ${{ needs.resolve.outputs.sha }}
      stage: ${{ inputs.stage }}
    secrets: inherit

  # Compiled here only on the commit line. A release installs the tarball its
  # GitHub Release carries, which is the byte-for-byte artifact the release was
  # cut from rather than a rebuild that would differ from it.
  build-runner:
    name: build runner
    needs: [resolve, plan]
    # This job reaches the stage's cloud role, so it carries the same branch
    # guard every Environment-binding job here does.
    if: >-
      ${{ !cancelled() && !failure() && needs.plan.outputs.runner == 'build'
      && (github.ref == 'refs/heads/main' || inputs.stage == 'dev') }}
    environment: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    steps:
      # The tree the binary is built from, and the submodules it is built with:
      # `runner:build` refuses a checkout whose submodules are missing or do not
      # match the commit, because a commit-keyed object holding anything else
      # would claim bytes that commit does not produce.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive

      - uses: ./.github/actions/setup-infra
        with:
          stages: ${{ inputs.stage }}
          stage-config: ${{ vars.BOXLITE_MSTAGE_BOXLITE_APP_CONFIG }}

      - name: Resolve the stage
        id: config
        working-directory: apps/infra
        run: |
          set -Eeuo pipefail
          if ! output="$(npm run --silent mbuild inspect -- --stage "${{ inputs.stage }}" 2>&1)"; then
            echo "::error title=stage::$output"
            exit 1
          fi
          echo "$output"
          echo "$output" >> "$GITHUB_OUTPUT"

      - name: Federate an AWS identity
        if: steps.config.outputs.kind == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/boxlite-${{ inputs.stage }}-github-deploy
          aws-region: ${{ steps.config.outputs.region }}
          role-session-name: mdeploy-all-runner-${{ github.run_id }}

      - name: Federate a GCP identity
        if: steps.config.outputs.kind == 'artifact-registry'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      # `runner:build` reaches Cloud Storage through the CLI, and the federation
      # above writes a credential without installing one.
      - name: Install gcloud
        if: steps.config.outputs.kind == 'artifact-registry'
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify the session through mstage
        working-directory: apps/infra
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if npm run --silent mstage login; then exit 0; fi
            echo "mstage reports no usable session (attempt $attempt/3); retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error title=mstage::No usable session for ${{ steps.config.outputs.kind }} after 3 attempts"
          exit 1

      # Not retried. The destination is proved before anything is compiled, so
      # the failures left are the build itself and a refusal about what is
      # already in the bucket — and neither answer changes on a second ask.
      - name: Build the runner
        working-directory: apps/infra
        run: npm run runner:build -- --stage "${{ inputs.stage }}"

  deploy:
    name: ${{ inputs.apply && 'deploy' || 'preview' }} ${{ inputs.stage }}
    needs: [resolve, plan, release-publish, release-promote, build-images, build-runner]
    # Every artifact job is skipped when the stage already holds what it needs,
    # and a skipped dependency skips its dependents unless this says otherwise.
    # `!failure()` is what still stops a deploy whose artifacts did not arrive.
    if: ${{ !cancelled() && !failure() && (github.ref == 'refs/heads/main' || inputs.stage == 'dev') }}
    environment: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-infra
        with:
          stages: ${{ inputs.stage }}
          stage-config: ${{ vars.BOXLITE_MSTAGE_BOXLITE_APP_CONFIG }}

      # What this job deploys, as an address rather than as the name it was
      # given. The runner half says which of the two artifacts the stack
      # installs: a release names the version whose GitHub Release carries the
      # tarball, a commit names the object this run staged in the bucket. Both
      # are set explicitly so the mode is readable in the run rather than
      # inferred from an absence.
      - name: Address what this deploy installs
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          COMPONENTS: ${{ inputs.components }}
        run: |
          set -Eeuo pipefail
          # Build mode only when this run actually staged one. `plan` leaves the
          # runner alone for `components: api`, so naming a build-mode binary
          # there would point the fleet at `runner/<sha>/` in a bucket nothing
          # wrote to — `runnerArtifactFor` composes that address without asking
          # whether it exists, so the apply reports success and the host 404s at
          # boot.
          #
          # The release line has no such hole and needs no such test: a version
          # pins the whole stage, VERSION is exported whatever `components`
          # said, and `resolve` proved that release carries its tarball before
          # any Environment was bound.
          source=release
          case "$COMPONENTS" in
            *runner*) [ -z "$VERSION" ] && source=build ;;
          esac
          {
            printf 'BOXLITE_IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'RUNNER_ARTIFACT_SOURCE=%s\n' "$source"
            if [ "$source" = 'build' ]; then
              printf 'RUNNER_ARTIFACT_REF=%s\n' "$SHA"
            elif [ -n "$VERSION" ]; then
              # `VERSION` is the selector `stack/runner-binary.ts` honours; it
              # strips the leading v itself. Left unset on a commit rollout that
              # was not about the runner, where the workspace version is the
              # release the stage already installs.
              printf 'VERSION=%s\n' "$VERSION"
            fi
          } >> "$GITHUB_ENV"

      # ----------------------------------------------------------- 1/5
      # Which cloud this stage deploys to, and where in it. One file says both,
      # and nothing after this point knows the answer in advance.
      - name: Resolve the stage
        id: config
        working-directory: apps/infra
        run: |
          set -Eeuo pipefail
          if ! output="$(npm run --silent mbuild inspect -- --stage "${{ inputs.stage }}" 2>&1)"; then
            echo "::error title=stage::$output"
            exit 1
          fi
          echo "$output"
          echo "$output" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------- 2/5
      # An identity for that cloud. GitHub's OIDC token is the only thing this
      # runner can prove, so federation goes through the provider's own action;
      # mstage cannot mint a session it holds no token for.
      - name: Federate an AWS identity
        if: steps.config.outputs.kind == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Composed from the stage's AWS_ACCOUNT_ID, not a stored role ARN: the
          # role name is fixed per stage (bootstrap/environment.ts's
          # githubDeployRoleName), so only the account id has to be configured.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/boxlite-${{ inputs.stage }}-github-deploy
          aws-region: ${{ steps.config.outputs.region }}
          role-session-name: mdeploy-all-deploy-${{ github.run_id }}

      - name: Federate a GCP identity
        if: steps.config.outputs.kind == 'artifact-registry'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      # The apply asks Certificate Manager what this project already holds
      # before it changes anything (`src/dns-authorization.ts`), and it asks
      # through the CLI — which the federation above writes a credential for but
      # does not install. Without it the check reports that it could not read
      # and lets the apply through, which is the guard never running at all.
      # The checks below shell out to the same CLI.
      - name: Install gcloud
        if: steps.config.outputs.kind == 'artifact-registry'
        uses: google-github-actions/setup-gcloud@v2

      # ----------------------------------------------------------- 3/5
      # A read, so a transient failure says nothing about the answer: retried.
      - name: Verify the session through mstage
        working-directory: apps/infra
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if npm run --silent mstage login; then exit 0; fi
            echo "mstage reports no usable session (attempt $attempt/3); retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error title=mstage::No usable session for ${{ steps.config.outputs.kind }} after 3 attempts"
          exit 1

      # Both of these answer about the stage's own contents, so a second ask
      # returns the same answer: neither is retried.
      - name: Verify the stage configuration still matches its own fingerprint
        working-directory: apps/infra
        run: npm run --silent mstage env digest -- --stage "${{ inputs.stage }}"

      # ----------------------------------------------------------- 4/5
      # Does this stage hold these images yet? mbuild answers, because mbuild
      # composes the address the deploy resolves — a check that built its own
      # string could pass against an address nothing pulls.
      - name: Verify the images
        working-directory: apps/infra
        run: npm run --silent mbuild verify -- --tag "$BOXLITE_IMAGE_TAG" --stage "${{ inputs.stage }}"

      # ----------------------------------------------------------- 5/5
      # Read through mstage's own loader, out of the declaration setup-infra
      # restored — the same reader mdeploy refuses on (src/run.ts's
      # `scope.protect`). The point of asking here is when rather than whether:
      # a refusal in the apply comes after this job has federated an identity
      # and taken the stage's concurrency group.
      - name: Confirm a protected stage
        working-directory: apps/infra
        env:
          STAGE: ${{ inputs.stage }}
          CONFIRMED: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          protected="$(node -e "
            const { loadConfig, stageIn } = require('mstage/config');
            process.stdout.write(String(Boolean(stageIn(loadConfig(), process.env.STAGE).protect)))
          ")"
          if [ "$protected" = 'true' ] && [ "$CONFIRMED" != 'true' ]; then
            echo "::error title=protected::$STAGE is protected; re-dispatch with confirm"
            exit 1
          fi

      # Never retried. A run killed mid-apply can leave the per-stage lock held,
      # and a second attempt then fails on the lock rather than on the cause
      # worth reading. Clearing it by hand is a first-class command:
      # `npm run mstage state unlock -- --stage <stage>`.
      - name: Apply
        working-directory: apps/infra
        run: |
          set -Eeuo pipefail
          if [ "${{ inputs.apply }}" = "true" ]; then
            npm run mdeploy -- --stage "${{ inputs.stage }}" ${{ inputs.confirm && '--confirm' || '' }}
          else
            npm run mdeploy -- --stage "${{ inputs.stage }}" --diff
          fi

      - name: Report
        if: always()
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -Eeuo pipefail
          {
            echo "### mdeploy-all ${{ inputs.stage }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| line | \`${VERSION:+release }${VERSION:-commit}\` |"
            echo "| commit | \`$SHA\` |"
            echo "| images | \`$BOXLITE_IMAGE_TAG\` |"
            echo "| runner | \`$RUNNER_ARTIFACT_SOURCE\` |"
            echo "| cloud | \`${{ steps.config.outputs.kind == 'ecr' && 'aws' || 'gcp' }}\` in \`${{ steps.config.outputs.region }}\` |"
            echo "| intent | \`${{ inputs.apply && 'apply' || 'preview' }}\` |"
            echo "| result | \`${{ job.status }}\` |"
            echo
            echo "From a checkout:"
            echo
            echo '```'
            echo "npm run mdeploy -- --stage ${{ inputs.stage }} --diff"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
